<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d5b8"/>
      <stop offset="100%" stop-color="#e0b094"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="url(#bg)"/>
  
  <!-- Shoulders / Clothes -->
  <path d="M 35,200 C 35,145 65,135 100,135 C 135,135 165,145 165,200 Z" fill="#1a202c"/>
  
  <!-- Neck -->
  <rect x="88" y="105" width="24" height="35" fill="#e0b094" rx="4"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="85" rx="36" ry="44" fill="url(#skin)"/>
  
  <!-- Hair -->
  <path d="M 62,75 C 60,35 140,35 138,75 C 138,50 128,40 100,40 C 72,40 62,50 62,75 Z" fill="#2c1d11"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="82" r="3.5" fill="#2d3748"/>
  <circle cx="115" cy="82" r="3.5" fill="#2d3748"/>
  
  <!-- Eyebrows -->
  <path d="M 78,74 Q 85,71 92,74" stroke="#2c1d11" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 108,74 Q 115,71 122,74" stroke="#2c1d11" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100,82 L 97,94 L 102,94" stroke="#cfa082" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Mouth / Neutral expression -->
  <path d="M 92,106 Q 100,107 108,106" stroke="#b87b68" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
